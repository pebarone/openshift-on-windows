apiVersion: v1
kind: Namespace
metadata:
  name: openshift-console
  labels:
    app.kubernetes.io/name: openshift-console
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-console-user-settings
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: openshift-console
---
apiVersion: v1
kind: Secret
metadata:
  name: console-token
  namespace: openshift-console
  annotations:
    kubernetes.io/service-account.name: console
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-console-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: console
    namespace: openshift-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: openshift-console
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      serviceAccountName: console
      containers:
        - name: console
          image: quay.io/openshift/origin-console:4.22
          imagePullPolicy: IfNotPresent
          env:
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "off-cluster"
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_ENDPOINT
              value: "https://kubernetes.default.svc"
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_SKIP_VERIFY_TLS
              value: "true"
            - name: BRIDGE_K8S_AUTH
              value: "bearer-token"
            - name: BRIDGE_K8S_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: console-token
                  key: token
            - name: BRIDGE_LISTEN
              value: "http://0.0.0.0:9000"
            - name: BRIDGE_BASE_ADDRESS
              value: "http://console.localtest.me"
            - name: BRIDGE_USER_SETTINGS_LOCATION
              value: "localstorage"
            - name: BRIDGE_BRANDING
              value: "openshift"
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: openshift-console
spec:
  selector:
    app: console
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: openshift-console
spec:
  ingressClassName: nginx
  rules:
    - host: console.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  number: 9000
