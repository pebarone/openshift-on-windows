apiVersion: v1
kind: Namespace
metadata:
  name: openshift-ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-sync
  namespace: openshift-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: route-sync
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes", "routes/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: route-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: route-sync
subjects:
  - kind: ServiceAccount
    name: route-sync
    namespace: openshift-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-sync
  namespace: openshift-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-sync
  template:
    metadata:
      labels:
        app: route-sync
    spec:
      serviceAccountName: route-sync
      containers:
        - name: route-sync
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/route-sync.py"]
          env:
            - name: ROUTE_DOMAIN
              value: apps.localtest.me
            - name: INGRESS_CLASS
              value: nginx
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: route-sync
